version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: [/bootstrap, /infra]
    schedule:
      interval: weekly
  # The workload's versions are part of its results: torch, numpy and
  # scikit-learn are pinned so a rerun measures the same code. No version
  # bumps; security updates still arrive through Dependabot alerts.
  - package-ecosystem: pip
    directory: /workloads
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
